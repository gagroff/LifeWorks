name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/LifeWorks.Application.Tests --configuration Release --no-build --verbosity normal
          dotnet test tests/LifeWorks.Domain.Tests --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/LifeWorks.Web/LifeWorks.Web.csproj --configuration Release --output ./publish --no-build

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: lifeworks-${{ vars.AZURE_SUFFIX }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
