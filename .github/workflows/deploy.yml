name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/LifeWorks.Application.Tests --configuration Release --no-build --verbosity normal
          dotnet test tests/LifeWorks.Domain.Tests --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/LifeWorks.Web/LifeWorks.Web.csproj --configuration Release --output ./publish --no-build

      - name: Zip publish output
        run: cd ./publish && zip -r ../app.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name lifeworks-${{ vars.AZURE_SUFFIX }} \
            --resource-group lifeworks-rg \
            --src-path app.zip \
            --type zip
